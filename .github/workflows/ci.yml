name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hashing
      CHROMA_PERSIST_DIR: .chroma_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit tests
        run: PYTHONPATH=src pytest tests/ -v
      - name: Ingest seed corpus
        run: PYTHONPATH=src python scripts/ingest_seed_data.py
      - name: Eval gate
        run: PYTHONPATH=src python -m sentinel.eval.run_eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: eval_report.json
